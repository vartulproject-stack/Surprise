<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aaradhya ✨</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            background: radial-gradient(circle at center, #1f1235 0%, #0f081d 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative; user-select: none; padding: 15px;
        }

        /* Floating Background Particles */
        .bg-heart {
            position: absolute; color: rgba(255, 105, 180, 0.25);
            font-size: 18px; animation: floatUp 8s infinite linear; bottom: -50px;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* Screen 1: Cute Red Envelope Wrapper */
        .envelope-container {
            text-align: center; cursor: pointer; transition: transform 0.4s ease; z-index: 10;
        }
        .envelope-container:hover { transform: scale(1.05); }

        .envelope {
            width: 280px; height: 180px; background: #ff4757; margin: 0 auto;
            position: relative; border-radius: 0 0 15px 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .envelope::before { /* Flap */
            content: ''; position: absolute; top: 0; left: 0;
            border-left: 140px solid transparent; border-right: 140px solid transparent;
            border-top: 100px solid #ff6b81; transform-origin: top;
            transition: transform 0.4s ease; z-index: 3;
        }

        .envelope::after { /* Pocket */
            content: ''; position: absolute; bottom: 0; left: 0;
            border-left: 140px solid #ff4757; border-right: 140px solid #ff4757;
            border-bottom: 90px solid #ee5253; border-radius: 0 0 15px 15px; z-index: 2;
        }

        .heart-seal {
            position: absolute; top: 80px; left: 50%; transform: translate(-50%, -50%);
            font-size: 32px; z-index: 4; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
        }

        .tap-text {
            color: #ff8da1; font-size: 16px; margin-top: 25px; font-weight: 500;
            letter-spacing: 1px; animation: pulse 1.8s infinite;
        }

        /* Screen 2: Bada Glass Letter Card */
        .big-letter-card {
            display: none; width: 100%; max-width: 600px;
            background: rgba(30, 20, 50, 0.85);
            backdrop-filter: blur(15px);
            border: 1.5px solid rgba(255, 105, 180, 0.35);
            border-radius: 24px; padding: 35px 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            position: relative; z-index: 20;
            animation: expandCard 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes expandCard {
            from { transform: scale(0.3); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .letter-header {
            font-family: 'Dancing Script', cursive;
            font-size: 32px; color: #ff69b4; text-align: center;
            margin-bottom: 20px; text-shadow: 0 0 12px rgba(255, 105, 180, 0.4);
        }

        /* Letter Body - Space aur Line Height ke saath */
        .letter-box {
            max-height: 420px; overflow-y: auto; padding-right: 10px;
            color: #f3e8ff; font-size: 15px; line-height: 1.95;
            white-space: pre-line; letter-spacing: 0.5px;
            font-weight: 400; text-align: left;
        }

        /* Typing Cursor Blink */
        .cursor {
            display: inline-block; width: 3px; background-color: #ff69b4;
            margin-left: 3px; animation: blink 0.8s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Custom Scrollbar for Letter */
        .letter-box::-webkit-scrollbar { width: 5px; }
        .letter-box::-webkit-scrollbar-thumb { background: rgba(255, 105, 180, 0.3); border-radius: 10px; }

        /* Proposal Buttons */
        .btn-group {
            display: flex; justify-content: center; align-items: center; gap: 20px;
            margin-top: 25px; min-height: 50px; position: relative; opacity: 0;
            transition: opacity 0.8s ease;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white; border: none; padding: 13px 40px; font-size: 17px;
            font-weight: 600; border-radius: 30px; cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.4); transition: transform 0.2s;
        }
        .btn-yes:hover { transform: scale(1.08); }

        .btn-no {
            background: rgba(255, 255, 255, 0.12); color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 24px; font-size: 14px; border-radius: 30px;
            cursor: pointer; position: absolute; transition: all 0.2s ease;
        }

        /* Screen 3: Final Success Screen */
        .success-screen {
            display: none; text-align: center; color: white;
            animation: fadeIn 0.8s ease forwards; z-index: 30;
        }
        .success-screen h1 { font-family: 'Dancing Script', cursive; font-size: 42px; color: #ff69b4; margin-bottom: 10px; }
        .success-screen p { font-size: 18px; opacity: 0.9; line-height: 1.6; }

        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="bgHearts"></div>

<!-- Envelope Screen -->
<div id="envelopeScreen" class="envelope-container" onclick="openEnvelope()">
    <div class="envelope">
        <div class="heart-seal">💖</div>
    </div>
    <div class="tap-text">Aaradhya, tap to open 💌</div>
</div>

<!-- Bada Glass Letter Card -->
<div id="letterCard" class="big-letter-card">
    <div class="letter-header">Ek Chhoti Si Dil Ki Baat… 💌</div>
    <div class="letter-box">
        <span id="typedText"></span><span class="cursor" id="cursor"></span>
    </div>
    <div class="btn-group" id="btnGroup">
        <button class="btn-yes" onclick="acceptProposal()">YES! 💖</button>
        <button class="btn-no" id="noBtn" onmouseover="moveNoBtn()" onclick="moveNoBtn()">No 🙈</button>
    </div>
</div>

<!-- Final Celebration Screen -->
<div id="successScreen" class="success-screen">
    <div style="font-size: 65px; margin-bottom: 15px;">🎉✨💖</div>
    <h1>Yay! You Made My World Beautiful!</h1>
    <p>Hamesha aise hi khush raho aur mere saath chamakti raho, Aaradhya! ✨</p>
</div>

<script>
    // Floating hearts animation
    for(let i=0; i<18; i++) {
        let heart = document.createElement('div');
        heart.className = 'bg-heart';
        heart.innerHTML = ['💖', '🌸', '✨', '💫'][Math.floor(Math.random()*4)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
        heart.style.animationDelay = Math.random() * 3 + 's';
        document.getElementById('bgHearts').appendChild(heart);
    }

    // Exact Letter Text
    const letterText = `Dear Aaradhya

Pata nahi ye baat tumse kaise kahun, kyunki jab bhi tumhare baare mein sochta hoon, words kam pad jaate hain.

Tumse baat karna, tumhari baatein sunna aur tumhare saath chhoti-chhoti cheezein share karna mujhe bahut achha lagta hai. Tumhara ek chhota sa message bhi mera din better bana deta hai. Shayad tumhe pata bhi nahi hai ki tum mere liye kitni special ho.

Sach kahun toh ye letter likhte waqt bhi main thoda nervous hoon. Dil mein bahut saare questions hain—tum kya sochogi, tumhara answer kya hoga... Lekin main apni feelings tumse chhupana nahi chahta.

Mujhe tum pasand ho. ❤️

Tum isliye nahi pasand ho kyunki tum perfect ho, balki isliye kyunki tum jaisi ho, mujhe waise hi achhi lagti ho.

Main tumse koi pressure ya zabardasti ka answer nahi chahta. Bas apne dil ki baat tumhare saamne rakhna chahta tha.

Toh kya tum mujhe ek chance dogi, taaki hum ek-doosre ko aur achhe se jaan sakein aur is relationship ko ek beautiful beginning de sakein? ✨`;

    function openEnvelope() {
        document.getElementById('envelopeScreen').style.display = 'none';
        document.getElementById('letterCard').style.display = 'block';
        startRelaxedTyping();
    }

    // Dheere-dheere relaxed speed typing (45ms speed)
    let charIndex = 0;
    function startRelaxedTyping() {
        if (charIndex < letterText.length) {
            document.getElementById("typedText").innerText += letterText.charAt(charIndex);
            charIndex++;
            
            let letterBox = document.querySelector(".letter-box");
            letterBox.scrollTop = letterBox.scrollHeight;
            
            setTimeout(startRelaxedTyping, 45); 
        } else {
            // Typing complete hone par cursor stop aur buttons fade-in
            document.getElementById("cursor").style.display = "none";
            document.getElementById("btnGroup").style.opacity = "1";
        }
    }

    // Runaway No Button Effect
    function moveNoBtn() {
        const btn = document.getElementById('noBtn');
        const x = Math.random() * 200 - 100;
        const y = Math.random() * 80 - 40;
        btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    // On Yes Click
    function acceptProposal() {
        document.getElementById('letterCard').style.display = 'none';
        document.getElementById('successScreen').style.display = 'block';
        triggerGrandConfetti();
    }

    // Confetti Burst Effect
    function triggerGrandConfetti() {
        var duration = 3.5 * 1000;
        var end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 6,
                angle: 60,
                spread: 55,
                origin: { x: 0 }
            });
            confetti({
                particleCount: 6,
                angle: 120,
                spread: 55,
                origin: { x: 1 }
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }
</script>

</body>
</html>
